<section class="upload-picture-dialog">
  <header class="dialog-header">
    <h2>Upload a new image</h2>
    <p>Drag and drop an image here, or browse for a file on your device.</p>
  </header>

  <input #fileInput type="file" accept="image/png,image/jpeg" hidden (change)="onFileInputChange($event)" />

  <div class="dialog-form">
    <label class="dialog-field">
      <button
        type="button"
        class="drop-zone"
        [class.drop-zone-active]="isDragging"
        (click)="openFilePicker()"
        (dragenter)="onDragEnter($event)"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)">
        <ng-container *ngIf="previewUrl; else emptyState">
          <img class="preview-image" [src]="previewUrl" alt="Selected profile picture preview" />
          <div class="drop-copy">
            <strong>{{ selectedFile?.name }}</strong>
            <span>Click to choose a different image, or drag and drop another PNG or JPEG.</span>
          </div>
        </ng-container>

        <ng-template #emptyState>
          <div class="drop-icon">
            <mat-icon>cloud_upload</mat-icon>
          </div>
          <div class="drop-copy">
            <strong>Drop your image here</strong>
            <span>PNG or JPG up to 10 MB.</span>
          </div>
        </ng-template>
      </button>
    </label>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <footer class="dialog-actions">
    <button type="button" class="btn-secondary" (click)="close()" [disabled]="isUploading">Cancel</button>
    <button type="button" class="btn-primary" [disabled]="!canUpload" (click)="upload()">{{ isUploading ? 'Uploading...' : 'Upload picture' }}</button>
  </footer>
</section>
