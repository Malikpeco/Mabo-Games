<app-mabo-navbar></app-mabo-navbar>

<div class="library-page">

  <div class="library-layout" *ngIf="isAuthenticated(); else loginStateTpl">
    <aside class="sidebar">
      <app-genre-filter
        [genres]="genres"
        [selectedGenreIds]="selectedGenreIds"
        (toggleGenre)="toggleGenre($event)"
        (clearGenres)="clearGenres()"
      ></app-genre-filter>
    </aside>

    <main class="content">
      <header class="library-header">
        <div>
          <h1>My Library</h1>
          <p>Your owned games in one place.</p>
        </div>
      </header>
      <div class="top-row">
        <div class="library-actions">
          <span class="owned-count" *ngIf="!isLoading">{{ totalItems }} games</span>
        </div>

        <div class="search">
          <span class="search-icon">Search</span>
          <input
            class="search-input"
            type="text"
            placeholder="Search your library..."
            [(ngModel)]="search"
            (input)="onSearchChanged()"
          />
        </div>
      </div>
      
      <section class="favourites-section" *ngIf="!isLoading && favouriteGames.length > 0">
        <h2>Favourites</h2>
        <div class="games-grid">
          <app-library-game-card
            *ngFor="let g of favouriteGames; trackBy: trackByGameId"
            [userGame]="g"
            [isFavourite]="favouriteGameIds.has(g.gameId)"
            [isDownloading]="downloadingGameId === g.gameId"
            (openGame)="openGameDetails($event)"
            (toggleFavourite)="toggleFavourite($event)"
            (downloadGame)="downloadGame($event)"
          ></app-library-game-card>
      </div>
    </section>
    <br><br>
    <div class="section-divider"></div>
    <br><br>
      <section class="state-card" *ngIf="isLoading">
        <h2>Loading library...</h2>
      </section>

      <section class="state-card" *ngIf="!isLoading && errorMessage">
        <h2>Could not load library</h2>
        <p>{{ errorMessage }}</p>
        <button type="button" class="btn-primary" (click)="retry()">Try again</button>
      </section>

      <div class="games-grid library-grid" *ngIf="!isLoading && !errorMessage && filteredGames.length > 0">
        <app-library-game-card
          *ngFor="let g of filteredGames; trackBy: trackByGameId"
          [userGame]="g"
          [isFavourite]="favouriteGameIds.has(g.gameId)"
          [isDownloading]="downloadingGameId === g.gameId"
          (openGame)="openGameDetails($event)"
          (toggleFavourite)="toggleFavourite($event)"
          (downloadGame)="downloadGame($event)"
        ></app-library-game-card>
      </div>

      <section class="state-card" *ngIf="!isLoading && !errorMessage && filteredGames.length === 0">
          <div class="empty">
          No games found.
        </div>
      </section>
    </main>
  </div>

  <ng-template #loginStateTpl>
    <main class="login-state">
      <section class="state-card">
        <h2>Log in to view your library</h2>
        <p>Your purchased games will appear here after you sign in.</p>
        <button type="button" class="btn-primary" (click)="goToLogin()">Log in</button>
      </section>
    </main>
  </ng-template>

  <div class="cart-summary">
    <app-mabo-footer></app-mabo-footer>
  </div>
</div>
